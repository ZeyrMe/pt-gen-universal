services:
  app:
    image: ghcr.io/zeyrme/pt-gen-universal:${PT_GEN_VERSION:-2.0.1}
    pull_policy: missing
    restart: unless-stopped
    ports:
      - "${PT_GEN_BIND_ADDRESS:-127.0.0.1}:${PT_GEN_HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      STORAGE_PROVIDER: redis
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
